[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cre-underwriting"
version = "1.0.0"
description = "Commercial Real Estate Underwriting Pipeline — 5-scenario convexity analysis, 8-moat scoring, forensic deal intelligence"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "JT", email = "jt@example.com"}]
keywords = ["commercial-real-estate", "underwriting", "convexity", "deal-analysis", "cre"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]
scraping = [
    "websockets>=12.0",
]
all = [
    "cre-underwriting[dev,scraping]",
]

[project.scripts]
cre-pipeline = "cre_underwriting.pipeline:main"
cre-analyze = "cre_underwriting.convexity:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
